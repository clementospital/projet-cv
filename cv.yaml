projets:
  - slug: "ocaml-project"
    nom: "Ocaml-Project — flot maximum (Ford-Fulkerson)"
    type: "Projet scolaire"
    objectif: >
      Calcule le flot maximum dans un graphe orienté valué (algorithme de
      Ford-Fulkerson) et exporte le résultat en image SVG via Graphviz.
    pourquoi: >
      Projet en binôme du cours de programmation fonctionnelle à l'INSA
      Toulouse : il fallait implémenter l'algorithme complet au-dessus d'un
      squelette fourni par les enseignants (structure de graphe abstraite via
      une signature .mli), recherche de chemin augmentant par parcours en
      profondeur jusqu'à épuisement des chemins, puis mise à jour du graphe
      résiduel à chaque itération.
    contribution: >
      Implémentation de l'algorithme (recherche de chemin augmentant, mise à
      jour du graphe résiduel), des fonctions utilitaires sur les graphes, et
      des tests unitaires — 13 des 14 commits du dépôt.
    technos: ["OCaml", "Dune", "Graphviz"]
    url: "https://github.com/clementospital/Ocaml-Project"
    lancement:
      - "make build"
      - "./ftest.exe your_graph.txt your_source your_sink your_output.txt"
      - "dot -Tsvg your_output.txt > demo.svg"
    extraits:
      - fichier: "src/ford_fulk.ml"
        langage: "ocaml"
        code: |
          let find_path gr src dest =
            let rec dfs node path =
              if node = dest then List.rev path
              else
                let voisins_arcs = out_arcs gr node in
                let arcs_utilisables = List.filter (fun arc -> arc.lbl > 0) voisins_arcs in
                let voisins = List.map (fun x -> x.tgt) arcs_utilisables in
                let voisinsNotVisited = List.filter (fun x -> not (List.mem x path)) voisins in
                iterVoisins voisinsNotVisited path

            and iterVoisins vnv path =
              match vnv with
              | [] -> []
              | x :: rest ->
                let res = dfs x (x :: path) in
                if res = [] then iterVoisins rest path else res
            in
            dfs src [src]

          let algo_ford gr src dest =
            let rec aux acu =
              let nodePath = find_path acu src dest in
              match nodePath with
                | [] -> acu
                | path ->
                  let arcPath = find_arc_path acu path in
                  let minCapa = find_min_capacity arcPath in
                  aux (add_flow acu arcPath minCapa)
            in
            aux gr
      - fichier: "src/tools.ml"
        langage: "ocaml"
        code: |
          open Graph

          let clone_nodes gr = n_fold gr new_node empty_graph

          let gmap gr f = e_fold gr (fun acu x -> new_arc acu ({src = x.src ; tgt = x.tgt ; lbl = f x.lbl})) (clone_nodes gr)

          let add_arc gr id1 id2 (n : int) =
              let arc = find_arc gr id1 id2 in
              match arc with
                |None -> new_arc gr {src = id1 ; tgt = id2 ; lbl = n};
                |Some x-> new_arc gr {x with lbl = x.lbl + n};
    apprentissage: >
      Manipuler un vrai style de programmation fonctionnelle (récursion
      terminale, immutabilité, typage fort avec signatures .mli) sur un
      problème algorithmique concret, plutôt que sur des exercices isolés.
    points_forts:
      - "Algorithme correct et testé (tests unitaires) sur un graphe fourni par les enseignants"
      - "Export DOT/SVG pour visualiser directement le résultat"
    points_amelioration:
      - "Pas de gestion des graphes avec cycles négatifs ou cas limites hors périmètre du cours"

  - slug: "detecteur-images-ia"
    nom: "Détecteur d'images générées par IA"
    type: "Projet scolaire"
    objectif: >
      Détecte si une image a été générée par IA, en combinant une analyse de
      l'image brute (ResNet18) et une analyse fréquentielle (spectre FFT),
      via une interface Gradio pour tester une image et voir le taux de
      confiance de la prédiction.
    pourquoi: >
      Projet de recherche encadrée (PIR) en 4e année à l'INSA Toulouse,
      filière IA, réalisé en équipe : vérifier si combiner information
      spatiale et fréquentielle améliore la détection d'images générées par
      IA par rapport à une approche purement spatiale.
    contribution: >
      Conception et développement de l'interface Gradio du projet : chargement
      d'une image, appel du modèle, affichage de la prédiction et du taux de
      confiance, avec un thème visuel sombre personnalisé.
    technos: ["Python", "PyTorch", "Gradio", "NumPy"]
    url: "https://github.com/vivienbn/pir_4a_ia"
    lancement:
      - "pip install torch torchvision gradio pillow numpy"
      - "python interface.py"
    extraits:
      - fichier: "interface.py"
        langage: "python"
        code: |
          class FreqBranch(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.net = nn.Sequential(
                      nn.Conv2d(1, 32, kernel_size=3, padding=1),
                      nn.BatchNorm2d(32), nn.ReLU(), nn.MaxPool2d(2),

                      nn.Conv2d(32, 64, kernel_size=3, padding=1),
                      nn.BatchNorm2d(64), nn.ReLU(), nn.MaxPool2d(2),

                      nn.Conv2d(64, 128, kernel_size=3, padding=1),
                      nn.BatchNorm2d(128), nn.ReLU(),
                      nn.AdaptiveAvgPool2d((1, 1)),
                      nn.Flatten(),
                  )

              def forward(self, x):
                  return self.net(x)


          class FusionModel(nn.Module):
              def __init__(self):
                  super().__init__()
                  resnet = models.resnet18(weights=None)
                  self.branch_spatial = nn.Sequential(*list(resnet.children())[:-1], nn.Flatten())
                  self.branch_freq    = FreqBranch()
                  self.classifier     = nn.Sequential(
                      nn.Linear(512 + 128, 256),
                      nn.ReLU(),
                      nn.Dropout(0.5),
                      nn.Linear(256, 2),
                  )

              def forward(self, x_spatial, x_freq):
                  feat_s = self.branch_spatial(x_spatial)         # [B, 512]
                  feat_f = self.branch_freq(x_freq)               # [B, 128]
                  return self.classifier(torch.cat([feat_s, feat_f], dim=1))
      - fichier: "interface.py"
        langage: "python"
        code: |
          def compute_freq_tensor(image_pil: Image.Image) -> torch.Tensor:
              """
              Reproduit la représentation fréquentielle utilisée à l'entraînement.
              On calcule la magnitude log du spectre FFT 2D de l'image en niveaux de gris.
              """
              gray = image_pil.convert("L").resize((IMAGE_SIZE, IMAGE_SIZE))
              arr  = np.array(gray, dtype=np.float32)

              fshift = np.fft.fftshift(np.fft.fft2(arr))
              mag    = np.log(np.abs(fshift) + 1).astype(np.float32)   # [H, W]

              tensor = torch.from_numpy(mag).unsqueeze(0)               # [1, H, W]
              tensor = transforms.Normalize(mean=[MEAN_FREQ], std=[STD_FREQ])(tensor)
              return tensor
    apprentissage: >
      Concevoir une interface simple (Gradio) pour rendre un modèle de deep
      learning testable par quelqu'un qui ne lit pas de code, et travailler en
      équipe sur un même dépôt (revues de code, découpage du travail).
    points_forts:
      - "Interface claire et immédiate : dépôt d'une image, prédiction et taux de confiance affichés"
      - "Fusion de deux sources d'information (spatiale et fréquentielle) plutôt qu'un seul modèle"
    points_amelioration:
      - "Pas d'évaluation quantitative publiée (précision/rappel) sur un jeu de test indépendant"

  - slug: "projet-cv"
    nom: "Générateur de CV & site personnel"
    type: "Projet personnel"
    objectif: >
      Pipeline qui transforme un unique fichier de données (cv.yaml) en trois
      sorties toujours synchronisées : un PDF compatible ATS, un site web
      personnel multi-pages, et le README du dépôt — le tout généré et
      déployé automatiquement à chaque modification.
    pourquoi: >
      Après avoir dû mettre à jour mon CV séparément à plusieurs endroits
      (PDF, LinkedIn, site perso) à chaque changement, avec le risque d'en
      oublier un, j'ai construit ce générateur pour n'avoir plus qu'une seule
      source de vérité à maintenir. Développé avec Claude Code, c'est aussi ce
      site que vous êtes en train de consulter.
    contribution: null
    technos: ["Python", "Jinja2", "Playwright", "GitHub Actions", "HTML/CSS/JS vanilla"]
    url: "https://github.com/clementospital/projet-cv"
    lancement:
      - "pip install -r requirements.txt"
      - "playwright install chromium"
      - "python src/build.py"
    extraits:
      - fichier: "src/build.py"
        langage: "python"
        code: |
          # Web : une page par entrée de PAGES, toutes héritent de base.html.j2 (nav commune).
          for page in PAGES:
              html = env.get_template(page["template"]).render(
                  page_actuelle=page["id"], pages=PAGES, annee=annee, base="", **contexte
              )
              (DIST_DIR / page["fichier"]).write_text(html, encoding="utf-8")

          # PDF : le CSS d'impression est injecté inline pour que le rendu ne dépende d'aucune
          # résolution de chemin file:// (Playwright charge le HTML via set_content, sans base URL).
          print_css = (STATIC_DIR / "print.css").read_text(encoding="utf-8")
          html_pdf = env.get_template("pdf.html.j2").render(print_css=print_css, **contexte)
          generer_pdf(html_pdf, DIST_DIR / "cv.pdf")
    apprentissage: >
      Séparer proprement données et présentation (une seule source cv.yaml,
      trois moteurs de rendu Jinja2) et industrialiser un pipeline avec de la
      CI/CD réelle : build, déploiement GitHub Pages et commit automatique des
      artefacts générés (PDF, README) à chaque push.
    points_forts:
      - "Une seule source de vérité (cv.yaml) pour 3 formats de sortie toujours synchronisés"
      - "Déploiement entièrement automatisé (push → build → Pages) via GitHub Actions"
      - "Zéro dépendance front : pas de framework, pas de CDN, pas de police externe"
    points_amelioration:
      - "Pas encore de tests automatisés (la validation YAML au démarrage sert de garde-fou)"
      - "Page Projets pas encore pensée pour un grand nombre de projets (tri/filtre à ajouter si la liste grandit)"

